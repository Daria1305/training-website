<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Фотографії лосів" />
  <title>Фотографії лосів</title>
  <link href="../css/style.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="custom-green-theme">
  <header class="text-center bg-success text-white py-3">
    <h1>Фотографії лосів</h1>
    <nav class="nav justify-content-center">
      <a href="../index.html" class="nav-link text-white">Головна</a>
      <a href="morphology.html" class="nav-link text-white">Зовнішній вигляд</a>
      <a href="nutrition.html" class="nav-link text-white">Харчування</a>
      <a href="population.html" class="nav-link text-white">Ареал</a>
    </nav>
  </header>

  <main class="container py-4">
    <div id="mooseCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#mooseCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Слайд 1"></button>
        <button type="button" data-bs-target="#mooseCarousel" data-bs-slide-to="1" aria-label="Слайд 2"></button>
        <button type="button" data-bs-target="#mooseCarousel" data-bs-slide-to="2" aria-label="Слайд 3"></button>
      </div>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <a href="../images/moose1.jpg" target="_blank">
            <img src="../images/moose1.jpg" class="d-block w-100" alt="Лось у лісі" title="Лось у лісі">
          </a>
        </div>
        <div class="carousel-item">
          <a href="../images/moose2.webp" target="_blank">
            <img src="../images/moose2.webp" class="d-block w-100" alt="Молодий самець лося" title="Молодий самець лося">
          </a>
        </div>
        <div class="carousel-item">
          <a href="../images/moose3.webp" target="_blank">
            <img src="../images/moose3.webp" class="d-block w-100" alt="Лось на фоні осіннього пейзажу" title="Лось на фоні осіннього пейзажу">
          </a>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#mooseCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Попередній</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#mooseCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Наступний</span>
      </button>
    </div>

    <section id="hornAge" class="mb-5">
      <h2 class="h4 text-success">Розрахунок віку рогів лося</h2>
      <p>Введіть кількість днів з моменту початку росту рогів, щоб дізнатися приблизну стадію розвитку.</p>
      <div class="input-group mb-3">
        <label class="input-group-text" for="daysInput">Кількість днів:</label>
        <input type="number" id="daysInput" class="form-control" placeholder="наприклад, 45">
      </div>
      <button class="btn btn-success mb-3" onclick="calculateHornAge()">Розрахувати</button>
      <div id="hornAgeResult" class="alert alert-success d-none"></div>
    </section>
  </main>

  <footer class="text-center bg-dark text-white py-2">
    <p>&copy; 2025 Сайт про лосів</p>
  </footer>

  <script>
    function calculateHornAge() {
      const days = parseInt(document.getElementById("daysInput").value, 10);
      const result = document.getElementById("hornAgeResult");

      if (isNaN(days) || days < 0) {
        result.textContent = "Введіть коректну кількість днів.";
        result.className = "alert alert-danger";
        result.classList.remove("d-none");
        return;
      }

      let message;
      if (days < 30) message = "Роги тільки почали рости.";
      else if (days < 60) message = "Роги активно формуються.";
      else if (days < 120) message = "Роги вже майже сформовані.";
      else message = "Роги повністю сформовані.";

      result.textContent = `Вік рогів: ${days} днів. ${message}`;
      result.className = "alert alert-success";
      result.classList.remove("d-none");
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
